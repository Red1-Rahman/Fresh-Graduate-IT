name: Release

on:
  push:
    tags:
      - "v*"

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create"
        required: true
        type: string

permissions: {}

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Determine release tag
        id: tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid release tag: $tag"
            echo "::error::Expected semantic version format such as v1.0.0"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Verify tag
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          git fetch --tags --force

          if ! git rev-parse "$TAG^{commit}" >/dev/null 2>&1; then
            echo "::error::Tag does not exist: $TAG"
            exit 1
          fi

          echo "Release tag: $TAG"
          git show --no-patch --format=fuller "$TAG"

      - name: Create source archives
        shell: bash
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p release

          git archive \
            --format=tar.gz \
            --prefix="Fresh-Graduate-IT-${TAG}/" \
            "$TAG" \
            > "release/Fresh-Graduate-IT-${TAG}.tar.gz"

          git archive \
            --format=zip \
            --prefix="Fresh-Graduate-IT-${TAG}/" \
            "$TAG" \
            > "release/Fresh-Graduate-IT-${TAG}.zip"

          sha256sum release/* > release/SHA256SUMS.txt

          ls -lh release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          set -euo pipefail

          gh release create "$TAG" \
            release/* \
            --title "$TAG" \
            --generate-notes
